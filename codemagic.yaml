workflows:
  bubbler-admin-ios:
    name: Bubbler Admin iOS Build (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.bubbleradmin"
        APP_NAME: "Bubbler Admin"
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install dependencies & setup Capacitor iOS
        script: |
          npm install --legacy-peer-deps
          npx cap add ios || true
          npx cap sync ios

      - name: Configure iOS Icons and Info.plist
        script: |
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -d "$ICON_DEST" ] && [ -f "AppIcon.png" ]; then
            cp "AppIcon.png" "$ICON_DEST/AppIcon-512@2x.png"
            cp "AppIcon.png" "$ICON_DEST/AppIcon.png"
          fi
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$PLIST" 2>/dev/null || true
          fi

      - name: Build iOS App (.ipa)
        script: |
          mkdir -p build/ios/ipa
          xcodebuild build \
            -workspace "ios/App/App.xcworkspace" \
            -scheme "App" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p build/ios/ipa/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/App.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr BubblerAdmin.ipa Payload
          rm -rf Payload

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
