workflows:
  bubbler-admin-ios:
    name: Bubbler Admin iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Dark to White
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bubbleradmin
      vars:
        BUNDLE_ID: "com.bubbleradmin"
        APP_NAME: "Bubbler Admin"
        APP_VERSION: "1.0.10"
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install dependencies & setup Capacitor iOS
        script: |
          npm install --legacy-peer-deps
          npx cap add ios || true
          npx cap sync ios

      - name: Set iOS deployment target to 15.0
        script: |
          # Update Podfile minimum iOS version
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/" ios/App/Podfile || true
          sed -i '' "s/platform :ios, '14.0'/platform :ios, '15.0'/" ios/App/Podfile || true
          # Update Xcode project deployment target
          cd ios/App
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' App.xcodeproj/project.pbxproj
          pod install
          cd ../..

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Configure iOS Icons and Info.plist
        script: |
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -d "$ICON_DEST" ] && [ -f "AppIcon.png" ]; then
            cp "AppIcon.png" "$ICON_DEST/AppIcon-512@2x.png"
            cp "AppIcon.png" "$ICON_DEST/AppIcon.png"
          fi
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$PLIST"
            BUILD_VER="${BUILD_NUMBER:-2}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_VER" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_VER" "$PLIST"
          fi

      - name: Build iOS App (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
